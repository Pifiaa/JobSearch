services:
  postgres:
    image: postgres:16
    container_name: jobsearch_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: jobsearch
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: jobsearch
    volumes:
      - jobsearch_postgres_data:/var/lib/postgresql/data
    networks:
      - jobsearch
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jobsearch']
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: jobsearch_redis
    restart: unless-stopped
    networks:
      - jobsearch
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    profiles: ["app"]
    container_name: jobsearch_api
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./api:/var/www/html
      - /var/run/docker.sock:/var/run/docker.sock
      - ./worker/data:/home/dev/projects/jobsearch/worker/data
    networks:
      - jobsearch
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  horizon:
    profiles: ["app"]
    container_name: jobsearch_horizon
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - ./api:/var/www/html
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - jobsearch
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  nginx:
    profiles: ["app"]
    container_name: jobsearch_nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./api:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - jobsearch
    depends_on:
      - api
  web:
    profiles: ["app"]
    container_name: jobsearch_web
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    networks:
      - jobsearch
    depends_on:
      - nginx
  worker:
    profiles: ["app"]
    container_name: jobsearch_worker
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./worker:/app
      - ./worker/data/cv.pdf:/app/data/cv.pdf:ro
    environment:
      - CV_PATH=/app/data/cv.pdf
    networks:
      - jobsearch
    command: >
      sh -c "pip install -r /app/requirements.txt --break-system-packages -q &&
            python -m spacy download es_core_news_md -q &&
            tail -f /dev/null"

  scheduler:
    profiles: ["app"]
    container_name: jobsearch_scheduler
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --no-ansi; sleep 60; done"
    volumes:
      - ./api:/var/www/html
      - /var/run/docker.sock:/var/run/docker.sock
      - ./worker/data:/home/dev/projects/jobsearch/worker/data
    networks:
      - jobsearch
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  jobsearch:
    driver: bridge
volumes:
  jobsearch_postgres_data: