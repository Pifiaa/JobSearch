server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 10M;

    # Docker's embedded DNS (127.0.0.11) resuelve nombres de servicio; usar
    # una variable en fastcgi_pass (en vez del hostname fijo "api:9000")
    # obliga a nginx a resolver de nuevo cada `valid`, en lugar de cachear
    # la IP para siempre en el arranque. Sin esto, cada vez que se
    # reconstruye/recrea el contenedor `api` (nueva IP en la red de
    # Docker), nginx se queda apuntando a la IP vieja y todo /api/ devuelve
    # 502 hasta reiniciar nginx a mano.
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $upstream_api api:9000;
        fastcgi_pass $upstream_api;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Default es 60s — muy corto para esperar una respuesta del LLM local.
        fastcgi_read_timeout 240s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}